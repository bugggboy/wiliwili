name: probe · MPVKit xcframework 最低系统

# M1 第一步（v2）：只回答一个问题——MPVKit 预编译的 Libmpv 支持到哪个 iOS 版本。
# v1 在 Linux 上读 Info.plist 拿到的是占位值 100.0，不可信；
# 真正的部署目标写在 Mach-O 的 LC_BUILD_VERSION 里，必须用 vtool / otool 看，所以要 macOS。

on:
  push:
    paths:
      - ".github/workflows/ios-mpv-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: 下载 Libmpv.xcframework
        run: |
          set -e
          curl -sL --retry 3 -o libmpv.zip \
            "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libmpv.xcframework.zip"
          ls -lh libmpv.zip
          unzip -q libmpv.zip -d mpv
          echo "===== 切片 ====="
          ls mpv/Libmpv.xcframework
          echo "===== xcframework 清单 ====="
          plutil -p mpv/Libmpv.xcframework/Info.plist

      - name: 读 ios-arm64 切片的真实部署目标
        run: |
          set -x
          FW=mpv/Libmpv.xcframework/ios-arm64/Libmpv.framework
          ls -la "$FW"
          file "$FW/Libmpv"
          echo "===== vtool ====="
          vtool -show-build "$FW/Libmpv" || true
          echo "===== otool LC_BUILD_VERSION ====="
          otool -l "$FW/Libmpv" 2>/dev/null | grep -A6 "LC_BUILD_VERSION" | head -40
          echo "===== 静态还是动态 ====="
          otool -hv "$FW/Libmpv" 2>/dev/null | head -5

      - name: mpv 客户端 API 版本
        run: |
          grep -n "MPV_CLIENT_API_MAJOR_VERSION\|MPV_CLIENT_API_MINOR_VERSION" \
            mpv/Libmpv.xcframework/ios-arm64/Libmpv.framework/Headers/mpv/client.h | head -5

      - name: 顺带看 ffmpeg 的部署目标
        run: |
          curl -sL --retry 3 -o av.tar.gz \
            "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libavcodec.xcframework.zip"
          unzip -q av.tar.gz -d av
          vtool -show-build av/Libavcodec.xcframework/ios-arm64/Libavcodec.framework/Libavcodec || true
