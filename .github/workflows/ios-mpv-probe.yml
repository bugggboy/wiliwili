name: probe · MPVKit xcframework 最低系统

# M1 第一步：先不编译，只回答一个问题——
# MPVKit 预编译的 Libmpv.xcframework 到底支持到哪个 iOS 版本？
# 如果它的 MinimumOSVersion 高于 14.0，那"自己编 mpv"就成了唯一出路。
# 跑在 ubuntu 上（1 倍分钟数），只做下载 + 解包 + 读 Info.plist。

on:
  push:
    paths:
      - ".github/workflows/ios-mpv-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Libmpv.xcframework
        run: |
          set -e
          curl -sL --retry 3 -o libmpv.zip \
            "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libmpv.xcframework.zip"
          ls -lh libmpv.zip
          unzip -q libmpv.zip -d mpv
          echo "===== 顶层结构 ====="
          ls -la mpv
          echo "===== xcframework 内部 ====="
          find mpv -maxdepth 2 -type d | head -30

      - name: 打印每个切片的 MinimumOSVersion
        run: |
          python3 - <<'PY'
          import glob, os, plistlib

          roots = glob.glob('mpv/**/*.xcframework', recursive=True)
          if not roots:
              raise SystemExit('没找到 xcframework')
          for root in roots:
              print(f'=== {root} ===')
              plists = sorted(glob.glob(os.path.join(root, '**', 'Info.plist'), recursive=True))
              if not plists:
                  print('  没有 Info.plist')
              for p in plists:
                  with open(p, 'rb') as f:
                      d = plistlib.load(f)
                  print(f'  {os.path.relpath(p, root)}')
                  print(f'    LibraryIdentifier      = {d.get("LibraryIdentifier")}')
                  print(f'    SupportedPlatform      = {d.get("SupportedPlatform")}')
                  print(f'    SupportedPlatformVariant = {d.get("SupportedPlatformVariant")}')
                  print(f'    MinimumOSVersion       = {d.get("MinimumOSVersion")}')
                  print(f'    CFBundleShortVersionString = {d.get("CFBundleShortVersionString")}')
          PY

      - name: 看链接产物与头文件
        run: |
          echo "===== 静态库 ====="
          find mpv -name "*.a" -exec ls -lh {} \; | head -20
          echo "===== 头文件 ====="
          find mpv -name "*.h" | head -20
          echo "===== mpv 客户端 API 版本 ====="
          grep -rn "MPV_CLIENT_API_MAJOR_VERSION\|MPV_CLIENT_API_MINOR_VERSION" mpv --include=*.h | head -5
